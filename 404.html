<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Pipoll</title>
    <script>
    (function () {
        var path = window.location.pathname;

        // Any /placeholder.html with trailing junk (e.g. %20, %0A, +) → /placeholder.html
        if (/^\/placeholder\.html./i.test(path)) {
            window.location.replace('/placeholder.html');
            return;
        }

        // Generic cleanup: strip trailing whitespace/plus from any other path
        try {
            var decoded = decodeURIComponent(path);
            var clean = decoded.replace(/[\s+]+$/, '');
            if (clean && clean !== decoded) {
                window.location.replace(clean + window.location.search + window.location.hash);
            }
        } catch (e) {}
    })();
    </script>
    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
    </script>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --bg-alt: #fafafa;
            --text: #0a0a0a;
            --text-secondary: #6e6e73;
            --border: #e5e5e5;
            --highlight: #FFA2F0;
            --highlight-dim: #9D69CE;
            --nav-height: 56px;
            --nav-bg: rgba(255, 255, 255, 0.8);
        }

        [data-theme="dark"] {
            --bg: #0a0a0a;
            --bg-alt: #111111;
            --text: #f5f5f7;
            --text-secondary: #86868b;
            --border: #1a1a1a;
            --nav-bg: rgba(10, 10, 10, 0.8);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: var(--nav-bg);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .navbar-logo {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            font-size: 0.85rem;
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text);
        }

        .hero {
            position: relative;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 24px;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            top: -15%;
            left: -10%;
            background: radial-gradient(circle, rgba(255, 162, 240, 0.3) 0%, transparent 70%);
            animation: drift 18s ease-in-out infinite;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            bottom: -10%;
            right: -10%;
            background: radial-gradient(circle, rgba(157, 105, 206, 0.25) 0%, transparent 70%);
            animation: drift 22s ease-in-out infinite reverse;
        }

        .orb-3 {
            width: 400px;
            height: 400px;
            top: 40%;
            left: 55%;
            background: radial-gradient(circle, rgba(255, 162, 240, 0.2) 0%, transparent 70%);
            animation: drift 26s ease-in-out infinite;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -30px) scale(1.08); }
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 640px;
            animation: fadeUp 0.8s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 24px;
        }

        .eyebrow-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--highlight);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .error-code {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: clamp(7rem, 24vw, 13rem);
            font-weight: 600;
            letter-spacing: -0.05em;
            line-height: 1;
            background: linear-gradient(135deg, var(--highlight) 0%, var(--highlight-dim) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .error-title {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-top: 8px;
        }

        .error-text {
            font-size: 1.05rem;
            color: var(--text-secondary);
            margin: 16px auto 40px;
            max-width: 420px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: var(--text);
            color: var(--bg);
            border-radius: 100px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .btn-primary:hover {
            transform: scale(1.04);
            opacity: 0.9;
        }

        .error-links {
            margin-top: 32px;
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 0.85rem;
        }

        .error-links a {
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        .error-links a:hover {
            color: var(--text);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-logo">pipoll</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/blog.html">Blog</a>
            <a href="/contact.html">Contact</a>
        </div>
    </nav>

    <main class="hero">
        <div class="hero-bg">
            <div class="gradient-orb orb-1"></div>
            <div class="gradient-orb orb-2"></div>
            <div class="gradient-orb orb-3"></div>
        </div>
        <div class="hero-content">
            <div class="error-eyebrow">
                <span class="eyebrow-dot"></span>
                <span>Stock Delisted</span>
            </div>
            <h1 class="error-code">404</h1>
            <h2 class="error-title">This page isn't on the market.</h2>
            <p class="error-text">
                The page you're looking for was moved, delisted, or never went public.
            </p>
            <a href="https://pipoll.live/" class="btn-primary">
                <span>Back to Pipoll</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M7 17L17 7M17 7H7M17 7V17"/>
                </svg>
            </a>
            <div class="error-links">
                <a href="https://pipoll.live/contact.html">Contact</a>
                <a href="https://pipoll.live/terms.html">Terms</a>
                <a href="https://pipoll.live/privacy.html">Privacy</a>
            </div>
        </div>
    </main>
</body>
</html>
